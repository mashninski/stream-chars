<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<title>stream-chars — тэставая панэль</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; background: #f4f4f4; color: #222; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input { flex: 1 1 200px; font: inherit; padding: 6px 8px; }
  select { font: inherit; padding: 6px 8px; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  #status { font-size: 14px; margin-bottom: 16px; }
  #status.off { color: #b00; }
  input[type=number] { flex: 0 0 80px; }
  h2 { font-size: 16px; }
  ul { list-style: none; padding: 0; }
  ul li { padding: 4px 8px; cursor: pointer; border-radius: 4px; }
  ul li:hover { background: #ddd; }
  .character { color: #666; }
  .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid #333; vertical-align: middle; margin-left: 4px; }
  .empty { color: #777; }
</style>
</head>
<body>
<h1>Тэставая панэль</h1>
<div id="status" class="off">Няма злучэння з праграмай</div>
<div class="row">
  <input id="name" placeholder="Нік гледача" maxlength="25" autofocus>
</div>
<div class="row">
  <button data-action="join">Дадаць гледача</button>
  <button data-action="leave">Прыбраць гледача</button>
</div>
<div class="row">
  <input id="text" placeholder="Тэкст паведамлення" maxlength="500">
  <button data-action="message">Паведамленне</button>
</div>
<div class="row">
  <select id="act" title="Дзеянне"></select>
  <button data-action="act">Дзеянне</button>
  <button data-action="resetFirstWord" title="Каб праверыць сцэну «першае слова» яшчэ раз">Скінуць «першае слова»</button>
</div>
<div class="row">
  <select id="trait" title="Прыкмета героя"></select>
  <span id="valueBox"></span>
  <button data-action="trait">Змяніць</button>
</div>
<div class="row">
  <input id="channel" placeholder="Канал-рэйдэр" maxlength="25">
  <input id="raidCount" type="number" min="1" value="5" title="Колькі гледачоў у рэйдзе">
  <button id="raid">Рэйд</button>
</div>
<h2>Гледачы на экране: <span id="count">0</span></h2>
<ul id="list"></ul>
<h2>У чарзе: <span id="queueCount">0</span></h2>
<ul id="queue"></ul>
<h2>Рэйд на экране: <span id="raidersCount">0</span></h2>
<ul id="raiders"></ul>
<script type="module" src="/js/test.js"></script>
</body>
</html>
